name: revert current go and fix sync

on:
  push:
    branches: [revert-current-go-fix]
    paths:
      - '.github/workflows/revert-current-go-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert-current-go-fix
      - name: Restore pre-round workflow and fix invalid expressions
        shell: python
        run: |
          from pathlib import Path
          import json

          wf = Path('render-n8n/workflows/notion-google-calendar-sync-v2.json')
          data = json.loads(wf.read_text())
          node = next(n for n in data['nodes'] if n.get('name') == 'Normalize Event Fields')
          items = node['parameters']['assignments']['assignments']
          by_name = {x['name']: x for x in items}

          by_name['calendarTitle']['value'] = "={{ ($json.title || 'Untitled task').length > 60 ? ($json.title || 'Untitled task').slice(0,57) + '…' : ($json.title || 'Untitled task') }}"
          by_name['eventDescription']['value'] = "={{ 'Task: ' + ($json.title || 'Untitled task') + '\n\nWhen: ' + (!$json.startRaw ? '—' : (!$json.startRaw.includes('T') ? ('All day · ' + $json.startRaw.slice(0,10) + ($json.endRaw ? ' → ' + $json.endRaw.slice(0,10) : '')) : ($json.startRaw + ($json.endRaw ? ' → ' + $json.endRaw : '')))) + '\nPriority: ' + ($json.priority || '—') + '\nCalendar: ' + ($json.calendarName || '—') + '\nNotion: ' + ($json.pageUrl || '') }}"

          wf.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n')

          pkg = Path('render-n8n/package.json')
          p = json.loads(pkg.read_text())
          p['scripts']['start'] = 'N8N_RUNNERS_MODE=external N8N_RUNNERS_AUTH_TOKEN=local-only-unused-token node --max-old-space-size=384 ./node_modules/n8n/bin/n8n start'
          pkg.write_text(json.dumps(p, indent=2) + '\n')

          for name in ['render-n8n/diagnose-format-sync.cjs', 'render-n8n/latest-sync-diagnostic.cjs']:
              q = Path(name)
              if q.exists():
                  q.unlink()
      - name: Commit fixed reverted state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/revert-current-go-fix.yml
          git add render-n8n/workflows/notion-google-calendar-sync-v2.json render-n8n/package.json
          git add -u render-n8n/diagnose-format-sync.cjs render-n8n/latest-sync-diagnostic.cjs 2>/dev/null || true
          git commit -m 'fix: revert latest simplification and repair sync expressions'
          git push origin HEAD:revert-current-go-fix
