name: n8n request-log probe

on:
  push:
    branches: [webhook-probe-test]
    paths:
      - '.github/workflows/n8n-webhook-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Render request path
        shell: bash
        run: |
          curl --connect-timeout 20 --max-time 60 -sS \
            'https://n8n-webhook-sync.onrender.com/__notion_verify__/CHATGPT_PATH_TOKEN_20260830' \
            -o response.txt -w 'HTTP %{http_code}\n' || true
          cat response.txt || true
