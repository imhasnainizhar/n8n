name: create temporary webhook inbox

on:
  push:
    branches: [webhook-probe-test]
    paths:
      - '.github/workflows/n8n-webhook-probe.yml'
  workflow_dispatch:

jobs:
  create-inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Create anonymous Webhook.site token
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -X POST 'https://webhook.site/token' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"default_status":200,"default_content":"OK","default_content_type":"text/plain"}' > token.json
          python3 - <<'PY'
          import json
          d=json.load(open('token.json'))
          print('WEBHOOK_SITE_UUID=' + d['uuid'])
          print('CAPTURE_URL=https://webhook.site/' + d['uuid'])
          print('REQUESTS_API=https://webhook.site/token/' + d['uuid'] + '/requests?sorting=newest')
          PY
