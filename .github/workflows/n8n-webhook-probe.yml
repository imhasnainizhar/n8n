name: replay PUBG Notion webhook

on:
  push:
    branches: [webhook-probe-test]
    paths:
      - '.github/workflows/n8n-webhook-probe.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Replay realistic Notion page update
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 90 \
            -sS -o response.txt -w '%{http_code}' \
            -X POST 'https://n8n-webhook-sync.onrender.com/webhook/notion-google-calendar-sync' \
            -H 'content-type: application/json' \
            --data '{"id":"chatgpt-pubg-replay-20260830","type":"page.properties_updated","entity":{"type":"page","id":"5e71ee95-606c-45cd-9b60-bae72b469470"},"authors":[{"type":"person"}],"data":{"parent":{"data_source_id":"ff0dfdb4-a2ee-497e-b7b4-3eef398c717a"}},"timestamp":"2026-08-30T07:05:00Z"}')
          echo "HTTP $code"
          cat response.txt || true
          test "$code" = "200"
