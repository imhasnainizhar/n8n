name: n8n webhook probe

on:
  push:
    branches: [render-webhook]
    paths:
      - '.github/workflows/n8n-webhook-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production webhook
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --retry 4 --retry-delay 5 --connect-timeout 20 --max-time 90 \
            -sS -o response.txt -w '%{http_code}' \
            -X POST 'https://n8n-webhook-sync.onrender.com/webhook/notion-google-calendar-sync' \
            -H 'content-type: application/json' \
            --data '{"type":"probe"}')
          echo "HTTP $code"
          cat response.txt || true
          test "$code" = "200"
